services:
  # === BANCO DE DADOS ===
  postgres:
    image: postgres:16-alpine
    container_name: v2s-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-avf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-avf}
      POSTGRES_DB: ${POSTGRES_DB:-avf}
    ports:
      - "5433:5432"
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avf"]
      interval: 5s
      timeout: 3s
      retries: 5

  # === API (FastAPI + ffmpeg) ===
  api:
    build: .
    container_name: v2s-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-avf}:${POSTGRES_PASSWORD:-avf}@postgres:5432/${POSTGRES_DB:-avf}
    volumes:
      - ./data:/data
      - ./output:/output
      - ./app:/app/app
    depends_on:
      postgres:
        condition: service_healthy

  # === FRONTEND (Vue 3) ===
  frontend:
    build: ./frontend
    container_name: v2s-frontend
    ports:
      - "3000:3000"
    depends_on:
      - api
